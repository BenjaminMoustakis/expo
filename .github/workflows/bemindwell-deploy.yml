name: Deploy BeMindWell to Vercel

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'apps/BeMindWell/**'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'apps/BeMindWell/**'
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # For commenting on PRs
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine deployment environment
        id: deployment-env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" || "${{ github.ref }}" == "refs/heads/master" ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "prod-flag=--prod" >> $GITHUB_OUTPUT
          else
            echo "environment=preview" >> $GITHUB_OUTPUT
            echo "prod-flag=" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          node-version: '20.19.4'
          cache: 'yarn'

      - name: Install workspace dependencies
        run: yarn install --frozen-lockfile

      - name: Export web build
        working-directory: apps/BeMindWell
        run: yarn export:web

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        working-directory: apps/BeMindWell
        run: vercel pull --yes --environment=${{ steps.deployment-env.outputs.environment }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Prepare Vercel Deployment
      - name: Build Project Artifacts
        working-directory: apps/BeMindWell
        run: vercel build ${{ steps.deployment-env.outputs.prod-flag }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        id: deploy
        working-directory: apps/BeMindWell
        run: |
          url=$(vercel deploy --prebuilt ${{ steps.deployment-env.outputs.prod-flag }} --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> $GITHUB_OUTPUT
          echo "Deployed to: $url"

      - name: Comment PR with deployment URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 BeMindWell deployed to Vercel!\n\n**Preview URL:** ${{ steps.deploy.outputs.url }}`
            })
